# Strict publication path: validates frozen bindings/artifacts and renders
# without invoking R or the numbered analytical pipeline. The workflow
# commits the verified docs/ publication back to main.
name: Publish frozen Quarto site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.qmd'
      - 'analysis/*.qmd'
      - 'assets/*.js'
      - 'assets/*.json'
      - 'assets/*.sha256'
      - 'assets/project-workflow.svg'
      - 'diagrams/project-workflow.tex'
      - '_freeze/**'
      - 'scripts/website/**'
      - 'config/**'
      - '_quarto.yml'
      - 'styles.css'
      - 'references.bib'
      - '.github/workflows/publish.yml'

permissions:
  contents: write

concurrency:
  group: frozen-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and frozen presentation assets
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.25'

      - name: Test presentation safety guards
        run: node --test scripts/website/*.test.mjs

      - name: Render frozen presentation (no R or analytical execution)
        run: node scripts/website/build.mjs

      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs
          git diff --cached --quiet || git commit -m "Publish frozen website presentation"
          git push
